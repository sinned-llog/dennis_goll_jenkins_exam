apiVersion: apps/v1
kind: Deployment

metadata:
  name: cast-service

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: cast-service

  template:
    metadata:
      labels:
        app: cast-service

    spec:

      imagePullSecrets:
        - name: regcred

      containers:
        - name: cast-service

          image: "{{ .Values.cast.repository }}:{{ .Values.cast.tag }}"

          imagePullPolicy: {{ .Values.cast.pullPolicy }}

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URI
              value: "postgresql://cast_db_username:cast_db_password@cast-db/cast_db_dev"

          livenessProbe:
            httpGet:
              path: /api/v1/checkapi
              port: 8000

          readinessProbe:
            httpGet:
              path: /api/v1/checkapi
              port: 8000